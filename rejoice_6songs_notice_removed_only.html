<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Rejoice! 온 세상 기뻐하라 - 합창 파트연습실</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: #f5f6f8;
    color: #20242a;
    min-height: 100vh;
  }
  .wrap {
    width: min(680px, 100%);
    margin: 0 auto;
    padding: 28px 18px 36px;
  }
  .hero {
    text-align: center;
    padding: 18px 10px 24px;
  }
  .label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #6b7280;
    margin-bottom: 10px;
  }
  h1 {
    margin: 0;
    font-size: clamp(24px, 7vw, 34px);
    line-height: 1.25;
    letter-spacing: -1.5px;
  }
  .sub {
    margin: 10px 0 0;
    color: #6b7280;
    font-size: 14px;
  }
  .notice {
    background: white;
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 18px;
    text-align: center;
    font-size: 13px;
    color: #555b65;
    box-shadow: 0 2px 12px rgba(0,0,0,.05);
  }
  .songs { display: grid; gap: 12px; }
  .song {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    min-height: 70px;
    padding: 12px 16px;
    border: 0;
    border-radius: 17px;
    background: #fff;
    color: #20242a;
    text-decoration: none;
    box-shadow: 0 3px 14px rgba(0,0,0,.07);
    transition: transform .12s ease, box-shadow .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .song:active { transform: scale(.985); }
  .num {
    flex: 0 0 42px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #111827;
    color: white;
    font-weight: 700;
    font-size: 15px;
  }
  .title {
    flex: 1;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.4px;
  }
  .arrow {
    color: #9ca3af;
    font-size: 24px;
    line-height: 1;
  }
  footer {
    text-align: center;
    margin-top: 24px;
    color: #9ca3af;
    font-size: 11px;
    line-height: 1.6;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #111315; color: #f3f4f6; }
    .notice, .song { background: #1b1f23; color: #f3f4f6; }
    .sub, .notice, footer { color: #9ca3af; }
    .num { background: #f3f4f6; color: #111827; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="label">PRACTICE ROOM</div>
    <h1>Rejoice!<br>온 세상 기뻐하라</h1>
    <p class="sub">온라인 합창 파트연습실</p>
  </header>

  <main class="songs">
    <a class="song" href="https://m.joongangart.kr/RejoiceWholeWorld/01/pop1.html">
      <span class="num">1</span><span class="title">세상의 빛</span><span class="arrow">›</span>
    </a>
    <a class="song" href="https://m.joongangart.kr/RejoiceWholeWorld/03/pop1.html">
      <span class="num">2</span><span class="title">낮고 낮은 이 곳에</span><span class="arrow">›</span>
    </a>
    <a class="song" href="https://m.joongangart.kr/RejoiceWholeWorld/04/pop1.html">
      <span class="num">3</span><span class="title">귀한 예물 가지고</span><span class="arrow">›</span>
    </a>
    <a class="song" href="https://m.joongangart.kr/RejoiceWholeWorld/05/pop1.html">
      <span class="num">4</span><span class="title">경배하세 경배하세</span><span class="arrow">›</span>
    </a>
    <a class="song" href="https://m.joongangart.kr/RejoiceWholeWorld/06/pop1.html">
      <span class="num">5</span><span class="title">큰 기쁨의 소식</span><span class="arrow">›</span>
    </a>
    <a class="song" href="https://m.joongangart.kr/RejoiceWholeWorld/07/pop1.html">
      <span class="num">6</span><span class="title">온 세상 기뻐하라</span><span class="arrow">›</span>
    </a>
  </main>

  <footer>
    원본: 중앙아트 「Rejoice, 온 세상 기뻐하라!」<br>
    휴대폰 브라우저에서 파일을 열어 사용할 수 있습니다.
  </footer>
</div>
</body>
</html>
